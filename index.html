
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./assets/css/style.css">
<title>Mi Ecommerce</title>

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        Mi Ecommerce
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h3>Categorías</h3>

        <p>Perfumes (13)</p>
        <p>Ropa (21)</p>
        <p>Accesorios (5)</p>
        <p>Otros (4)</p>
        <p>Zapatos (10)</p>

    </aside>

    <!-- PRODUCTOS -->
    <main class="productos">

        <!-- CARD 1 -->
        <div class="card">

            <img src="./assets/img/perfume.jpg" alt="perfume">

            <div class="info">
                <h4>Perfume myKingdom</h4>
                <p>31.400</p>
            </div>

            <button>Comprar</button>

        </div>

        <!-- CARD 2 -->
        <div class="card">

            <img src="./assets/img/phamton.jpg" alt="phamton">

            <div class="info">
                <h4>Perfume Phantom</h4>
                <p>68.900</p>
            </div>

            <button>Comprar</button>

        </div>

        <!-- CARD 3 -->
        <div class="card">

            <img src="./assets/img/zapatos.jpg" alt="Zapatos">

            <div class="info">
                <h4>Zapatos Docker</h4>
                <p>29.700</p>
            </div>

            <button>Comprar</button>

        </div>

        <!-- CARD 4 -->
        <div class="card">

            <img src="./assets/img/puma.jpg" alt="poleron-puma">

            <div class="info">
                <h4>Poleron Puma</h4>
                <p>44.700</p>
            </div>

            <button>Comprar</button>

        </div>

    </main>

<!-- FOOTER -->
<footer class="footer">
    @miecommerce
</footer>


</div>

</body>
</html>
